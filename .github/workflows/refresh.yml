name: Refresh GitHub Contribution Heatmap

on:
  workflow_dispatch:

  schedule:
    - cron: "15 0 * * *"   # Daily at 00:15 UTC (~5:45 AM IST)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Contribution Data
        run: |
          python scripts/fetch_contributions.py

      - name: Render Heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit Updated Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: |
            data/contributions.json
            data/contrib-heatmap.svg